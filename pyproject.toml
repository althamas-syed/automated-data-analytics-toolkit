[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-data-analytics-toolkit"
version = "0.1.0"
description = "Dependency-free CSV profiling, data-quality checks and anomaly summaries"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
analyze-csv = "analytics_toolkit.cli:main"

[tool.setuptools.packages.find]
include = ["analytics_toolkit*"]
